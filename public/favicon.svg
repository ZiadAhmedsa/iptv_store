<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Rounded Square Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- TV Screen Shape -->
  <rect x="10" y="14" width="44" height="30" rx="4" fill="white" fill-opacity="0.15" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
  <!-- 4K Text -->
  <text x="32" y="35" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="18" fill="white" letter-spacing="-1">4K</text>
  <!-- Trophy Icon (small) -->
  <g transform="translate(24, 44) scale(0.7)">
    <path d="M8 0C8 0 4 0 4 4L6 8H10L12 4C12 0 8 0 8 0Z" fill="url(#gold)"/>
    <rect x="6" y="8" width="4" height="2" rx="0.5" fill="url(#gold)"/>
    <rect x="5" y="10" width="6" height="1.5" rx="0.5" fill="url(#gold)"/>
    <path d="M0 2C0 2 3 4 4 4V2C2 2 0 2 0 2Z" fill="url(#gold)" fill-opacity="0.7"/>
    <path d="M16 2C16 2 13 4 12 4V2C14 2 16 2 16 2Z" fill="url(#gold)" fill-opacity="0.7"/>
  </g>
  <!-- Signal Lines -->
  <path d="M44 18 Q48 16 50 18" stroke="white" stroke-opacity="0.5" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M44 22 Q50 19 53 22" stroke="white" stroke-opacity="0.35" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
